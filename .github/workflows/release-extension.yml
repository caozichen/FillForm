name: 发布扩展压缩包

on:
  push:
    branches:
      - main
    paths:
      - 'extension/chrome-mv3/**'
      - '.github/workflows/release-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取扩展版本
        id: ext
        run: |
          version="$(node -p "require('./extension/chrome-mv3/manifest.json').version")"
          short_sha="${GITHUB_SHA::7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "asset=FillForm-${version}-${short_sha}.zip" >> "$GITHUB_OUTPUT"

      - name: 压缩可加载扩展
        run: |
          mkdir -p dist
          (
            cd extension/chrome-mv3
            zip -r "../../dist/${{ steps.ext.outputs.asset }}" . \
              -x '*.map' \
              -x '.DS_Store' \
              -x '*/.DS_Store'
          )

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ext.outputs.tag }}
          name: FillForm ${{ steps.ext.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            解压后即可在 Chrome 中加载。

            1. 下载并解压 `${{ steps.ext.outputs.asset }}`
            2. 打开 `chrome://extensions`
            3. 开启开发者模式
            4. 选择「加载已解压的扩展程序」，指向解压后的目录

            扩展版本：`${{ steps.ext.outputs.version }}`
            提交：`${{ github.sha }}`
          files: dist/${{ steps.ext.outputs.asset }}
